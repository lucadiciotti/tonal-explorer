<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tonal Explorer</title>
    <meta property="og:image" content="https://bolt.new/static/og_default.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://bolt.new/static/og_default.png">
  </head>
  <body>
    <div id="root">
      <div id="loading-fallback" style="display:flex;min-height:100vh;align-items:center;justify-content:center;font-family:system-ui,sans-serif;background:#f8fafc;">
        <div style="text-align:center;">
          <div style="width:40px;height:40px;border:3px solid #cbd5e1;border-top-color:#1e293b;border-radius:50%;margin:0 auto 16px;animation:spin 1s linear infinite;"></div>
          <p style="color:#64748b;font-size:14px;">Caricamento di Tonal Explorer...</p>
        </div>
      </div>
      <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
    </div>
    <script>
      window.addEventListener('error', function(e) {
        var fb = document.getElementById('loading-fallback');
        if (fb) {
          fb.innerHTML = '<div style="text-align:center;max-width:400px;padding:20px;">' +
            '<h1 style="color:#1e293b;font-size:20px;margin-bottom:8px;">Errore di caricamento</h1>' +
            '<p style="color:#64748b;font-size:13px;margin-bottom:12px;">L\'app non si e caricata correttamente.</p>' +
            '<pre style="text-align:left;background:#f1f5f9;border-radius:8px;padding:12px;font-size:11px;color:#dc2626;overflow:auto;">' +
            (e.message || 'Errore sconosciuto') + '\n' + (e.filename || '') + ':' + (e.lineno || '') +
            '</pre></div>';
        }
      });
      window.addEventListener('unhandledrejection', function(e) {
        console.error('Unhandled promise rejection:', e.reason);
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
